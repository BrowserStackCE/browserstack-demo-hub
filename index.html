<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CZKRW5KJRS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    try {
      var params = new URLSearchParams(window.location.search);
      var rawParam = params.get('q_group_id');
      var storedId = sessionStorage.getItem('q_group_id');
      
      // The fallback cascade: URL -> Storage -> Default String
      var groupId = rawParam || storedId || 'independent_visit';

      if (groupId && groupId.trim() !== '') {
        sessionStorage.setItem('q_group_id', groupId.trim());
        gtag('set', { 'q_group_id': groupId.trim() });
      }
    } catch (e) { }

    gtag('config', 'G-CZKRW5KJRS', { send_page_view: false });
  </script>
  <meta charset="UTF-8" />
  <meta name="referrer" content="unsafe-url" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrowserStack Demo Hub</title>
  <link rel="icon" type="image/svg+xml" href="icons/browserstack-icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>

    </div>
    <div class="nav-search-wrap">
      <input type="search" id="globalSearch" class="nav-search" placeholder="Search videos…" autocomplete="off" aria-label="Search videos" />

</body>
