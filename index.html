<!DOCTYPE html>

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CZKRW5KJRS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    // Resolve q_group_id: query string -> hash query string -> sessionStorage -> default.
    // Computed outside any try/catch-around-everything so the fallback ALWAYS applies.
    var groupId = 'independent_visit';
    try {
      var hashQuery = location.hash.indexOf('?') > -1 ? location.hash.slice(location.hash.indexOf('?')) : '';
      var rawParam = new URLSearchParams(window.location.search).get('q_group_id')
        || new URLSearchParams(hashQuery).get('q_group_id');
      var storedId = null;
      try { storedId = sessionStorage.getItem('q_group_id'); } catch (e) { }
      var resolved = (rawParam && rawParam.trim()) || (storedId && storedId.trim());
      if (resolved) groupId = resolved;
      try { sessionStorage.setItem('q_group_id', groupId); } catch (e) { }
    } catch (e) { }
    window.__groupId = groupId;

    // Guarantee q_group_id on EVERY event, whatever the call site (inline onclick
    // handlers included) and however early/late it fires. An explicit value wins.
    (function () {
      var rawGtag = gtag;
      gtag = function (cmd, name, params) {
        if (cmd === 'event') {
          params = params || {};
          if (!params.q_group_id) params.q_group_id = window.__groupId;
          return rawGtag.call(this, cmd, name, params);
        }
        return rawGtag.apply(this, arguments);
      };
    })();

    gtag('set', { 'q_group_id': groupId });
    // Also on the config call so it is present from the very first hit
    gtag('config', 'G-CZKRW5KJRS', { send_page_view: false, q_group_id: groupId });
  </script>
